# Scout sources. Add a firm = add one block. No code changes needed.
#
# types
#   workday     host, tenant, site            (public search API behind any myworkdayjobs.com careers page)
#   greenhouse  board                         (boards.greenhouse.io/<board>)
#   lever       board                         (jobs.lever.co/<board>)
#   rendered    url                           (headless browser, works on any JavaScript careers page or aggregator)
#   html        url                           (plain GET, fastest, for simple static pages)
# options
#   aggregator: true   firm name comes from the listing, not from this block
#   keep_all: true     keep every link on the page (use on pages that ONLY list programmes)
#   enabled: false     switch a source off without deleting it
#
# STATUS: seed list. URLs were written without live access (the build sandbox blocks these hosts),
# so the first manual run is the verification pass. feed/health.json names every source that
# errored or returned zero items. Fix or swap those URLs, rerun, done.

sources:
  # ---------- aggregators (safety net, direct pages below are what gets her in early) ----------
